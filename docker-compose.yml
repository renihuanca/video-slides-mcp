services:
  video-slides-mcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      INPUT_DIR: /data/input
      OUTPUT_DIR: /data/output
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    volumes:
      - ./data/input:/data/input:ro
      - ./data/output:/data/output
    restart: unless-stopped
