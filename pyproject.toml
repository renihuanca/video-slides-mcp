[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-slides-mcp"
version = "0.1.0"
description = "FastMCP server that extracts presentation slides from videos using PySceneDetect and OpenCV."
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0,<5",
  "scenedetect[opencv-headless]>=0.6.6,<0.8",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
video-slides-mcp = "video_slides_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_slides_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
